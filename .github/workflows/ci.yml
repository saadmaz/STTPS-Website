name: CI

# Deployment is handled by Cloudflare, which builds and publishes from the
# connected repository. This workflow is the merge gate only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generates next-env.d.ts and route/image types before tsc runs on a fresh checkout.
      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build
